# ============================================================
# Agentic Financial RAG System — Docker Compose
# ============================================================
#
# Services:
#   ollama   — Local LLaMA-3 inference server
#   api      — FastAPI backend (agents + retrieval)
#   ui       — Streamlit frontend
#
# Usage:
#   docker compose up -d                     # start all services
#   docker compose up -d --build             # rebuild and start
#   docker compose logs -f api               # tail API logs
#   docker compose down -v                   # stop and remove volumes
#
# First-time setup:
#   docker compose up -d ollama
#   docker compose exec ollama ollama pull llama3:8b
#   docker compose exec ollama ollama pull nomic-embed-text
#   docker compose up -d api ui
# ============================================================

version: "3.9"

services:

  # ── Ollama LLM Server ──────────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: financial-rag-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_HOST=0.0.0.0
    # Uncomment if you have NVIDIA GPU:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - rag-network

  # ── Model Initialization (runs once) ──────────────────────────────────────
  ollama-init:
    image: ollama/ollama:latest
    container_name: financial-rag-ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: >
      /bin/sh -c "
        echo 'Pulling LLaMA-3 8B...' &&
        ollama pull llama3:8b &&
        echo 'Pulling nomic-embed-text...' &&
        ollama pull nomic-embed-text &&
        echo 'Models ready!'
      "
    networks:
      - rag-network
    restart: "no"

  # ── FastAPI Backend ────────────────────────────────────────────────────────
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: financial-rag-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ../data:/app/data
      - ../models:/app/models
      - ../evaluation:/app/evaluation
    env_file:
      - ../.env
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - API_RELOAD=false
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 90s
    networks:
      - rag-network
    labels:
      - "com.financial-rag.service=api"
      - "com.financial-rag.version=1.0.0"

  # ── Streamlit UI ───────────────────────────────────────────────────────────
  ui:
    build:
      context: ..
      dockerfile: docker/Dockerfile.ui
    container_name: financial-rag-ui
    restart: unless-stopped
    ports:
      - "8501:8501"
    env_file:
      - ../.env
    environment:
      - API_PORT=8000
      # Point UI to the API service name inside Docker network
      - API_HOST=api
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - rag-network
    labels:
      - "com.financial-rag.service=ui"

# ── Networks ───────────────────────────────────────────────────────────────
networks:
  rag-network:
    driver: bridge
    name: financial-rag-network

# ── Volumes ────────────────────────────────────────────────────────────────
volumes:
  ollama_data:
    name: financial-rag-ollama-data
